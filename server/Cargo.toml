[package]
name = "baccarat-server"
version = "0.1.0"
edition = "2024"
description = "REST API for baccarat-ev: exact odds of every bet over HTTP"

[dependencies]
axum = "0.8"
baccarat-ev = { path = ".." }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[dev-dependencies]
serde_json = "1.0.151"
tower = { version = "0.5.3", features = ["util"] }
